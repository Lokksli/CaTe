<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <link rel="stylesheet" href="/static/style.css">
    <title>Uzhhorod Weather</title>


</head>

<body>

    <h1>Temperature</h1>
    <div class="container">
        <div class="desc">
            <h1 class="headd">Data analysis</h1>
            <label>
                <input type="checkbox" id="dayAverageCheckbox">
                Show daily average
            </label>
            


            <p>
                Years: <span id="yearStart">1993</span> -
                <span id="yearEnd">1997</span>
            </p>

            <div class="range-slider"> 
                <input type="range" id="startSlider" min="1993" max="2025" value="1993">
                <input type="range" id="endSlider" min="1993" max="2025" value="1997">
            </div>


            <button id="applyButton" class="apply_button">
                Apply
            </button>

            <div class="temperature_info">
                <p id="highest_temp">Highest range temperature: </p>
                <p id="lowest_temp">Lowest range temperature: </p>
                <p id="hottest_month">Hottest month: </p>
                <p id="coldest_month">Coldest month: </p>
            </div>


            <p class="compare_years_p">
                Compare
                years: <span id="yearStartComparison">1993</span> -
                <span id="yearEndComparison">1997</span>
            </p>

            <div class="range-slider"> 
                <input type="range" id="startSliderComparison" min="1993" max="2025" value="1993">
                <input type="range" id="endSliderComparison" min="1993" max="2025" value="1997">
            </div>

            <button id="applyButtonComparison" class="apply_button">
                Compare
            </button>


        </div>
        <div id="graph" class="line">
            <iframe src="/temperature" class="first_graph" id="firstGraph"></iframe>
            <iframe class="second_graph" id="secondGraph"></iframe>
        </div>

    </div>
    <script src="/static/script.js"></script>
</body>

</html>
